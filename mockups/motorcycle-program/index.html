<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px;background:#fafafa}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>تمليك الموتوسيكل — تريد واي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ============ tokens ============ */
:root{
  direction:rtl;
  --bg:#F2F5F1; --surface:#FFFFFF; --surface2:#F7FAF6; --sunk:#EDF1EA;
  --line:#DCE3D9; --line-soft:#E8EDE4;
  --text:#14201A; --text2:#4B5C51; --text3:#7C8C81;
  --brand:#2E7D32; --brand-ink:#12482A; --brand-soft:#E3F1E2; --brand-line:#B9D9B7;
  --lime:#7CB342;
  --ok:#1B7F3B; --ok-soft:#E1F3E4;
  --warn:#9A6200; --warn-soft:#FBEFD6;
  --danger:#B3271E; --danger-soft:#FBE6E3;
  --info:#1F5F9E; --info-soft:#E2EDF8;
  --chrome:#101A14; --chrome2:#1B2820; --chrome-line:#2C3D33; --chrome-text:#E8F0E8; --chrome-dim:#93A79A;
  --shadow:0 1px 2px rgba(20,32,26,.05), 0 8px 24px -12px rgba(20,32,26,.18);
  --shadow-lift:0 2px 4px rgba(20,32,26,.06), 0 18px 40px -18px rgba(20,32,26,.28);
  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:26px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1410; --surface:#141E18; --surface2:#18241D; --sunk:#101A14;
    --line:#2A3A30; --line-soft:#223029;
    --text:#E7EFE8; --text2:#A8BCAE; --text3:#7B9184;
    --brand:#5DB863; --brand-ink:#CBE9CB; --brand-soft:#1A2E1E; --brand-line:#2F4C34;
    --lime:#9CCB5E;
    --ok:#63C179; --ok-soft:#142C1B;
    --warn:#E0A94A; --warn-soft:#2E2312;
    --danger:#EE8377; --danger-soft:#331815;
    --info:#79B1E6; --info-soft:#132537;
    --chrome:#070C09; --chrome2:#111A14; --chrome-line:#24332A; --chrome-text:#E8F0E8; --chrome-dim:#879B8D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1410; --surface:#141E18; --surface2:#18241D; --sunk:#101A14;
  --line:#2A3A30; --line-soft:#223029;
  --text:#E7EFE8; --text2:#A8BCAE; --text3:#7B9184;
  --brand:#5DB863; --brand-ink:#CBE9CB; --brand-soft:#1A2E1E; --brand-line:#2F4C34;
  --lime:#9CCB5E;
  --ok:#63C179; --ok-soft:#142C1B;
  --warn:#E0A94A; --warn-soft:#2E2312;
  --danger:#EE8377; --danger-soft:#331815;
  --info:#79B1E6; --info-soft:#132537;
  --chrome:#070C09; --chrome2:#111A14; --chrome-line:#24332A; --chrome-text:#E8F0E8; --chrome-dim:#879B8D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.display{font-family:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  font-weight:600;line-height:1.35;text-wrap:balance;margin:0}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* ============ prototype chrome ============ */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--chrome);
  border-bottom:1px solid var(--chrome-line);color:var(--chrome-text)}
.proto-in{max-width:1280px;margin:0 auto;padding-block:10px;padding-inline:16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.proto-brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.proto-brand b{font-family:"Readex Pro",sans-serif;font-weight:600;font-size:14px;letter-spacing:.01em}
.proto-brand small{display:block;color:var(--chrome-dim);font-size:11px;line-height:1.3}
.tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--chrome2);border:1px solid var(--chrome-line);
  border-radius:999px;padding:3px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--chrome-dim);
  transition:background .15s,color .15s;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--brand);color:#fff}
.proto-note{font-size:12px;color:var(--chrome-dim)}
.proto-note button{color:var(--lime);text-decoration:underline;text-underline-offset:3px;font-size:12px}
.screens{background:var(--chrome2);border-bottom:1px solid var(--chrome-line);
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:59}
.screens-in{max-width:1280px;margin:0 auto;padding-block:8px;padding-inline:16px;
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.screens-in::-webkit-scrollbar{height:4px}
.screens-in::-webkit-scrollbar-thumb{background:var(--chrome-line);border-radius:9px}
.screens button{flex:0 0 auto;padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:500;
  color:var(--chrome-dim);border:1px solid transparent;display:flex;align-items:center;gap:7px}
.screens button:hover{color:var(--chrome-text)}
.screens button[aria-current="true"]{background:var(--chrome);color:var(--chrome-text);border-color:var(--chrome-line)}
.screens .ix{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--lime);opacity:.85}
/* stage */
.stage{max-width:1280px;margin:0 auto;padding-block:22px 56px;padding-inline:16px}
.stage-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.stage-head h2{font-size:19px}
.stage-head p{font-size:13px;color:var(--text2);max-width:62ch}
.stage-kind{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text3);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
/* phone frame */
.phone-wrap{display:flex;justify-content:center}
.phone{width:min(430px,100%);background:var(--bg);border:9px solid var(--chrome);border-radius:40px;
  box-shadow:var(--shadow-lift);overflow:hidden;position:relative}
.phone-bar{background:var(--chrome);color:var(--chrome-dim);display:flex;justify-content:space-between;
  padding:2px 20px 6px;font-size:11px}
.phone-scroll{max-height:76vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
@media (max-width:620px){
  .phone{border:0;border-radius:0;box-shadow:none;width:100%}
  .phone-bar{display:none}
  .phone-scroll{max-height:none}
  .stage{padding-inline:0;padding-block:14px 40px}
  .stage-head{padding-inline:16px}
}
/* desktop app frame */
.desk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;
  box-shadow:var(--shadow);display:grid;grid-template-columns:212px 1fr}
.desk-side{background:var(--chrome);color:var(--chrome-dim);padding-block:16px;padding-inline:10px;
  display:flex;flex-direction:column;gap:2px}
.desk-side .who{padding:8px 10px 14px;border-bottom:1px solid var(--chrome-line);margin-bottom:10px}
.desk-side .who b{color:var(--chrome-text);font-size:13px;display:block}
.desk-side .who small{font-size:11px}
.desk-side a{padding:7px 10px;border-radius:8px;font-size:13px;display:flex;gap:9px;align-items:center;
  text-decoration:none}
.desk-side a[data-on="1"]{background:var(--chrome2);color:var(--chrome-text);box-shadow:inset 2px 0 0 var(--lime)}
.desk-main{min-width:0;background:var(--surface2)}
.desk-top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.desk-top h3{font-size:16px}
.desk-body{padding:18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:860px){
  .desk{grid-template-columns:1fr;border-radius:var(--r-m)}
  .desk-side{flex-direction:row;overflow-x:auto;gap:4px;padding:8px}
  .desk-side .who{display:none}
  .desk-side a{white-space:nowrap}
  .desk-body{padding:12px}
}
@media (max-width:620px){.desk{border-inline:0;border-radius:0}}
</style>
<style>
/* ============ shared product UI ============ */
.pad{padding-inline:18px}
.stack{display:flex;flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g18{gap:18px}.g24{gap:24px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--text2)}
.dim{color:var(--text3)}
.tiny{font-size:12px;line-height:1.6}
.sm{font-size:13px;line-height:1.7}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text3);text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px}
.card.flat{box-shadow:none}
.card.tight{padding:13px}
.sec-title{font-size:16px;margin-bottom:2px}
hr.rule{border:0;border-top:1px solid var(--line-soft);margin:0}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap;line-height:1.7}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill.plain::before{display:none}
.p-ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 26%,transparent)}
.p-dan{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 26%,transparent)}
.p-info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 26%,transparent)}
.p-mute{background:var(--sunk);color:var(--text2);border-color:var(--line)}
.p-brand{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-line)}
:root[data-theme="dark"] .p-brand,:root:not([data-theme="light"]) .p-brand{color:var(--brand-ink)}
.draft{font-size:10.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);
  border:1px dashed color-mix(in srgb,var(--warn) 45%,transparent);border-radius:6px;padding:2px 7px;white-space:nowrap}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;
  padding:11px 18px;border-radius:12px;border:1px solid transparent;transition:filter .15s,background .15s;
  text-decoration:none;text-align:center}
.btn:hover{filter:brightness(.96)}
.btn-pri{background:var(--brand);color:#fff}
:root[data-theme="dark"] .btn-pri,:root:not([data-theme="light"]) .btn-pri{color:#08150C}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn-soft{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-line)}
.btn-dan{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}
/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;font-weight:600}
.field .hint{font-size:11.5px;color:var(--text3)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;font:inherit;font-size:14px;color:var(--text)}
.inp::placeholder{color:var(--text3)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);
  background-position:left 16px top 50%,left 11px top 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);background:var(--surface);
  border-radius:11px;padding:10px 12px;font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brand-line)}
.opt input{accent-color:var(--brand);margin:5px 0 0}
.opt b{font-weight:600;display:block}
.opt span{font-size:11.5px;color:var(--text3)}
.opt[data-on="1"]{border-color:var(--brand);background:var(--brand-soft)}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opts.inline .opt{flex:1 1 130px}
.reveal{border-inline-start:2px solid var(--brand-line);padding-inline-start:12px;margin-inline-start:4px;
  display:flex;flex-direction:column;gap:12px}
.reveal-tag{font-size:11px;color:var(--brand);font-weight:600}
/* steps */
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.steps button{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;width:88px;text-align:start}
.steps .bar{height:4px;border-radius:9px;background:var(--line)}
.steps button[data-state="done"] .bar{background:var(--brand)}
.steps button[data-state="now"] .bar{background:var(--brand)}
.steps button[data-state="now"] .lb{color:var(--text);font-weight:600}
.steps .lb{font-size:11px;color:var(--text3);line-height:1.45}
/* timeline */
.tl{display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;inset-inline-start:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::before{display:none}
.tl .dot{width:21px;height:21px;border-radius:50%;border:2px solid var(--line);background:var(--surface);
  display:grid;place-items:center;font-size:11px;color:var(--text3);z-index:1}
.tl li[data-s="done"] .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.tl li[data-s="done"]::before{background:var(--brand)}
.tl li[data-s="now"] .dot{border-color:var(--brand);color:var(--brand);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent)}
.tl li[data-s="now"] b{color:var(--brand-ink)}
:root[data-theme="dark"] .tl li[data-s="now"] b,:root:not([data-theme="light"]) .tl li[data-s="now"] b{color:var(--brand)}
.tl b{font-size:13.5px;font-weight:600;display:block}
.tl p{font-size:12px;color:var(--text2)}
.tl time{font-size:11px;color:var(--text3);font-family:"IBM Plex Mono",monospace}
/* metric */
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.metric .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.metric .val{font-size:20px;font-weight:700;font-family:"IBM Plex Mono",monospace;line-height:1.2}
.metric .cap{font-size:11.5px;color:var(--text3)}
.track{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:9px}
.track i{display:block;height:100%;border-radius:9px;background:var(--brand)}
.track i.bad{background:var(--danger)}
.track i.mid{background:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid6{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
@media (max-width:460px){.grid6{grid-template-columns:1fr}}
@media (max-width:700px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.grid3{grid-template-columns:1fr}}
/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:660px}
table.tbl th{text-align:start;font-weight:600;color:var(--text3);font-size:11px;letter-spacing:.03em;
  padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--surface2)}
table.tbl td b{font-weight:600}
.matrix{min-width:520px}
/* notices */
.notice{border-radius:var(--r-m);padding:12px 14px;display:flex;gap:11px;align-items:flex-start;font-size:13px;line-height:1.65}
.notice b{display:block;font-weight:600;margin-bottom:2px}
.n-info{background:var(--info-soft);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 22%,transparent)}
.n-warn{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 24%,transparent)}
.n-ok{background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 24%,transparent)}
.n-dan{background:var(--danger-soft);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 24%,transparent)}
.notice .ico{font-size:15px;line-height:1.5}
/* misc */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text2)}
.chip[data-on="1"]{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .chip[data-on="1"],:root:not([data-theme="light"]) .chip[data-on="1"]{color:#08150C}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv dt{color:var(--text3);font-size:12px}
.kv dd{margin:0;font-weight:500}
.doc{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);
  border-radius:var(--r-m);background:var(--surface)}
.doc .ic{width:34px;height:34px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;flex:0 0 auto;font-size:15px}
.doc .t{flex:1;min-width:0}
.doc .t b{display:block;font-size:13px;font-weight:600}
.doc .t span{font-size:11.5px;color:var(--text3)}
.qr{width:112px;height:112px;border-radius:12px;background:
  repeating-conic-gradient(var(--text) 0 25%, transparent 0 50%) 0 0/16px 16px;
  border:6px solid var(--surface);box-shadow:0 0 0 1px var(--line);flex:0 0 auto}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--rc,var(--brand)) calc(var(--p)*1%),var(--sunk) 0)}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  font-size:12.5px;font-weight:700;font-family:"IBM Plex Mono",monospace}
</style>
<style>
/* ============ applicant-site specific ============ */
.app-top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.lockup{display:flex;align-items:center;gap:9px}
.lockup .mark{width:30px;height:30px;flex:0 0 auto}
.lockup .nm{font-family:"Readex Pro",sans-serif;font-weight:600;font-size:13.5px;line-height:1.2}
.lockup .nm small{display:block;font-size:10px;color:var(--text3);font-weight:400;font-family:"IBM Plex Sans Arabic",sans-serif}
.partner{display:flex;align-items:center;gap:8px;border-inline-start:1px solid var(--line);padding-inline-start:9px}
.partner .ub{font-family:"Readex Pro",sans-serif;font-weight:700;font-size:14px;letter-spacing:-.02em;color:var(--text)}
.partner .pl{font-size:9.5px;color:var(--text3);line-height:1.2}
.hero{background:
   radial-gradient(120% 90% at 92% 0%, color-mix(in srgb,var(--lime) 22%,transparent) 0%, transparent 58%),
   linear-gradient(190deg, var(--brand-soft) 0%, var(--surface) 78%);
  padding:26px 18px 22px;border-bottom:1px solid var(--line-soft);position:relative;overflow:hidden}
.hero .stripes{position:absolute;inset-inline-end:-30px;top:-20px;width:170px;height:170px;opacity:.16;pointer-events:none}
.hero h1{font-size:25px;line-height:1.45;font-weight:700;letter-spacing:-.01em;position:relative}
.hero h1 em{font-style:normal;color:var(--brand);display:block}
.hero p{font-size:14px;color:var(--text2);margin-top:10px;position:relative;max-width:34ch}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin-top:18px;position:relative}
.facts div{background:var(--surface);padding:11px 13px}
.facts b{display:block;font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;color:var(--brand-ink)}
:root[data-theme="dark"] .facts b,:root:not([data-theme="light"]) .facts b{color:var(--brand)}
.facts span{font-size:11px;color:var(--text3)}
.sec{padding:22px 18px;border-bottom:1px solid var(--line-soft)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:baseline;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.faq details{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.faq summary{padding:12px 14px;font-size:13.5px;font-weight:600;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;gap:10px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--brand);font-size:17px;font-weight:600}
.faq details[open] summary::after{content:"−"}
.faq p{padding:0 14px 13px;font-size:13px;color:var(--text2)}
.stickycta{position:sticky;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom,0px));
  display:flex;gap:9px;z-index:20}
.otp{display:flex;gap:9px;direction:ltr;justify-content:center}
.otp input{width:52px;height:58px;text-align:center;font-size:22px;font-weight:600;
  font-family:"IBM Plex Mono",monospace;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--text)}
.otp input[value]:not([value=""]){border-color:var(--brand);background:var(--brand-soft)}
.bikecard{background:linear-gradient(160deg,var(--brand-ink),#0A2E1A);color:#EAF6EA;border-radius:var(--r-l);
  padding:16px;position:relative;overflow:hidden}
.bikecard .stripes{position:absolute;inset-inline-start:-24px;bottom:-30px;width:150px;height:150px;opacity:.2}
.bikecard b{font-family:"Readex Pro",sans-serif;font-size:16px;font-weight:600}
.bikecard .plate{font-family:"IBM Plex Mono",monospace;font-size:15px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:3px 10px;display:inline-block}
.bikecard dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:14px 0 0;position:relative}
.bikecard dt{font-size:10.5px;color:#A8CFB0}
.bikecard dd{margin:0;font-size:13px;font-weight:600;font-family:"IBM Plex Mono",monospace}
.msg{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.msg:last-child{border-bottom:0}
.msg .av{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand-ink);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.msg .bd{flex:1;min-width:0}
.msg .bd p{font-size:12.5px;color:var(--text2);line-height:1.7}
.msg .bd .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.msg .bd b{font-size:12.5px}
.msg time{font-size:10.5px;color:var(--text3);font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.pointcard{border:1px solid var(--line);border-radius:var(--r-m);padding:12px;background:var(--surface);
  display:flex;flex-direction:column;gap:9px;cursor:pointer}
.pointcard[data-on="1"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 12%,transparent)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  font-family:"IBM Plex Mono",monospace}
.slot[data-on="1"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.slot[disabled]{opacity:.42;text-decoration:line-through;cursor:not-allowed}
.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.check:last-child{border-bottom:0}
.check .bx{width:21px;height:21px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;
  font-size:11px;flex:0 0 auto;background:var(--surface);color:transparent}
.check[data-s="done"] .bx{background:var(--brand);border-color:var(--brand);color:#fff}
.check[data-s="now"] .bx{border-color:var(--brand);color:var(--brand);border-style:dashed}
.check .bd{flex:1;min-width:0}
.check .bd b{font-size:13.5px;font-weight:600;display:block}
.check .bd p{font-size:12px;color:var(--text2)}
/* modal */
.sheet{position:fixed;inset:0;z-index:90;background:rgba(10,18,13,.55);display:grid;place-items:end center;padding:0}
.sheet-in{background:var(--surface);width:min(680px,100%);max-height:86vh;overflow-y:auto;
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--line);border-bottom:0}
@media (min-width:700px){.sheet{place-items:center}.sheet-in{border-radius:var(--r-xl);border-bottom:1px solid var(--line)}}
</style>

</head>
<body>
<div class="proto">
  <div class="proto-in">
    <div class="proto-brand">
      <svg class="mark" width="26" height="26" viewBox="0 0 120 120" aria-hidden="true">
        <g opacity=".9"><rect x="6" y="30" width="8" height="60" transform="rotate(-45 10 60)" fill="#7CB342"/>
        <rect x="18" y="30" width="8" height="60" transform="rotate(-45 22 60)" fill="#7CB342"/>

        <rect x="42" y="18" width="60" height="60" rx="4" transform="rotate(45 72 48)" fill="#43A047"/>

      </svg>
      <div><b>بروتوتايب — برنامج تمليك الموتوسيكلات</b>
        <small>تريد واي × أوبر · ٣ واجهات · ١٧ شاشة</small></div>
    </div>

  </div>
</div>
<nav class="screens" aria-label="شاشات البروتوتايب"><div class="screens-in" id="screenNav"></div></nav>
<main class="stage">
  <div class="stage-head">
    <div style="flex:1;min-width:240px">
      <h2 id="scTitle">—</h2>
      <p id="scDesc">—</p>
    </div>
    <span class="stage-kind" id="scKind">—</span>
  </div>
  <div id="scMount"></div>
</main>
<div id="sheetMount"></div>
<script>
/* ================= helpers ================= */
const TW_MARK = `<svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
  <g opacity=".9"><rect x="6" y="30" width="8" height="60" transform="rotate(-45 10 60)" fill="#7CB342"/>
  <rect x="18" y="30" width="8" height="60" transform="rotate(-45 22 60)" fill="#7CB342"/>
  <rect x="30" y="30" width="8" height="60" transform="rotate(-45 34 60)" fill="#7CB342"/></g>
  <rect x="42" y="18" width="60" height="60" rx="4" transform="rotate(45 72 48)" fill="#43A047"/>
  <text x="60" y="68" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="26" fill="#fff" text-anchor="middle">TW</text></svg>`;

const STRIPES = `<svg class="stripes" viewBox="0 0 120 120" aria-hidden="true">
  <rect x="6" y="10" width="10" height="100" transform="rotate(-45 11 60)" fill="#43A047"/>
  <rect x="26" y="10" width="10" height="100" transform="rotate(-45 31 60)" fill="#7CB342"/>
  <rect x="46" y="10" width="10" height="100" transform="rotate(-45 51 60)" fill="#43A047"/></svg>`;

const LOCKUP = `<div class="lockup">${TW_MARK}
  <div class="nm">تريد واي<small>Trade Way</small></div>
  <div class="partner"><div><div class="pl">بالشراكة مع</div><div class="ub">Uber</div></div></div>
</div>`;

const appHeader = (right) => `<header class="app-top">${LOCKUP}<div>${right||''}</div></header>`;

const phone = (inner) => `<div class="phone-wrap"><div class="phone">
  <div class="phone-bar"><span class="num">9:41</span><span>مصر · ٤G</span></div>
  <div class="phone-scroll" dir="rtl">${inner}</div></div></div>`;

const ADMIN_NAV = [
  ['ops','لوحة التشغيل','◧'],['apps','الطلبات','▤'],['profile','ملف متقدم','◉'],
  ['alloc','التخصيص والمواعيد','⬒'],['compliance','متابعة الالتزام','◈'],
  ['recovery','الاسترداد','⊘'],['points','نقاط التوزيع','⌂']
];
const desk = (activeId, title, topExtra, body) => `<div class="desk">
  <aside class="desk-side">
    <div class="who"><b>تريد واي — لوحة البرنامج</b><small>منى ع. · مشرف تشغيل</small></div>
    ${ADMIN_NAV.map(([id,lb,ic])=>`<a href="#" data-go="admin:${id}" data-on="${id===activeId?1:0}"><span aria-hidden="true">${ic}</span>${lb}</a>`).join('')}
  </aside>
  <div class="desk-main">
    <div class="desk-top"><h3 style="flex:1">${title}</h3>${topExtra||''}</div>
    <div class="desk-body">${body}</div>
  </div></div>`;

const pill = (kind, text) => `<span class="pill p-${kind}">${text}</span>`;
const DRAFT = `<span class="draft">قيمة مبدئية — لم تُعتمد مع أوبر</span>`;

/* حدود الماتريكس المبدئية — يتغيّر من هنا لما تتأكد مع أوبر */
const MATRIX = [
  {k:'hours', lb:'ساعات أونلاين', target:'٨ ساعات / يوم', how:'من تقرير أوبر الأسبوعي — ساعات الاتصال بالتطبيق'},
  {k:'days',  lb:'أيام التشغيل',  target:'٢٦ يوم / شهر',  how:'اليوم يُحتسب عند تحقيق حد أدنى من ساعات الاتصال'},
  {k:'acc',   lb:'نسبة قبول الطلبات', target:'٦٠٪ أو أعلى', how:'الطلبات المقبولة ÷ الطلبات المعروضة'},
  {k:'cnc',   lb:'نسبة الإلغاء', target:'٢٪ أو أقل', how:'الرحلات الملغاة من الكابتن ÷ الرحلات المقبولة'}
];
</script>
<script>
/* ================= 1. صفحة البرنامج ================= */
const S_landing = () => phone(`
${appHeader(`<button class="btn btn-ghost btn-sm" data-go="applicant:track">متابعة طلبي</button>`)}
<section class="hero">
  ${STRIPES}
  <span class="eyebrow">برنامج تمليك موتوسيكلات — دفعة ٢٠٢٦</span>
  <h1 style="margin-top:8px">اشتغل بالموتوسيكل<em>وفي الآخر يبقى باسمك.</em></h1>
  <p>برنامج من <b>تريد واي</b> بالشراكة مع <b>أوبر</b>. من غير مقدم ولا أقساط تمليك — الشرط الوحيد إنك تلتزم بساعات وأيام الشغل المتفق عليها طول مدة البرنامج.</p>
  <div class="facts">
    <div><b>٠ جنيه</b><span>مقدم</span></div>
    <div><b>٠ جنيه</b><span>قسط تمليك شهري</span></div>
    <div><b>١٢ شهر</b><span>مدة البرنامج (مبدئية)</span></div>
    <div><b>مدينتين</b><span>القاهرة الكبرى · الغردقة</span></div>
  </div>
  <div class="row" style="margin-top:12px">${DRAFT}<span class="tiny dim">المدة والشروط تحت الاعتماد النهائي مع أوبر.</span></div>
</section>

<section class="sec">
  <div class="sec-h"><h3 class="sec-title">الرحلة من التقديم للتملّك</h3></div>
  <ol class="tl">
    ${[
      ['١','قدّم وسجّل بياناتك','دقيقتين على الموبايل. لو أوبر رشّحتك، رقمك هيتعرف عليك أوتوماتيك.'],
      ['٢','مراجعة وفلترة','بنراجع الرخصة والخبرة ومنطقة السكن، وبنحدد أقرب نقطة توزيع ليك.'],
      ['٣','تجهيز حسابك على أوبر','لو معندكش حساب أو حسابك ناقص، فيه موظف من عندنا بيمشي معاك الخطوة دي.'],
      ['٤','المستندات والضامن','بطاقة، رخصة، فيش وتشبيه، إثبات سكن، وضامن حسب الشروط.'],
      ['٥','التعاقد والاستلام','تمضي العقد ومحضر الاستلام، وتستلم الموتوسيكل من نقطة التوزيع.'],
      ['٦','التزام… ثم التملّك','تكمّل مؤشرات التشغيل طول المدة، وبعدها الملكية تتنقل باسمك.']
    ].map(([n,t,d],i)=>`<li data-s="${i<1?'now':'todo'}"><span class="dot">${n}</span>
      <div><b>${t}</b><p>${d}</p></div></li>`).join('')}
  </ol>
</section>

<section class="sec" style="background:var(--surface2)">
  <div class="sec-h"><h3 class="sec-title">التزاماتك خلال البرنامج</h3>${DRAFT}</div>
  <div class="tbl-wrap" style="margin-bottom:10px"><table class="tbl matrix">
    <thead><tr><th>المؤشر</th><th>المطلوب</th><th>بنقيسه إزاي</th></tr></thead>
    <tbody>${MATRIX.map(m=>`<tr><td><b>${m.lb}</b></td>
      <td><span class="num" style="font-weight:600">${m.target}</span></td>
      <td class="dim">${m.how}</td></tr>`).join('')}</tbody>
  </table></div>
  <div class="notice n-info"><span class="ico">ⓘ</span><div>
    <b>الطلب الضعيف في منطقتك مش خصم عليك</b>
    لو الشغل قلّ في منطقتك أو حصل عطل أو مرض، الحالة بتترفع لمراجعة بشرية قبل أي قرار — مش خصم أوتوماتيك.</div></div>
</section>

<section class="sec">
  <div class="sec-h"><h3 class="sec-title">مين بيتحمّل إيه؟</h3></div>
  <div class="tbl-wrap"><table class="tbl matrix">
    <thead><tr><th>البند</th><th>على مين</th></tr></thead><tbody>
    <tr><td>ترخيص الموتوسيكل واللوحات</td><td>${pill('brand','تريد واي')}</td></tr>
    <tr><td>التأمين خلال مدة البرنامج</td><td>${pill('brand','تريد واي')}</td></tr>
    <tr><td>عيوب التسليم (أي عيب مصنعي وقت الاستلام)</td><td>${pill('brand','تريد واي')}</td></tr>
    <tr><td>الصيانة الدورية والأعطال بعد الاستلام</td><td>${pill('mute','الكابتن — من خلال مراكز صيانة تريد واي')}</td></tr>
    <tr><td>البنزين والمخالفات المرورية</td><td>${pill('mute','الكابتن')}</td></tr>
    </tbody></table></div>
</section>

<section class="sec" style="background:var(--surface2)">
  <div class="sec-h"><h3 class="sec-title">المستندات المطلوبة</h3></div>
  <div class="stack g8">
    ${[
      ['🪪','بطاقة الرقم القومي','سارية · صورة واضحة للوجهين','أساسي'],
      ['🛵','رخصة قيادة موتوسيكل','سارية أو تحت الاستخراج','أساسي'],
      ['📄','فيش وتشبيه','حديث خلال ٣ شهور','أساسي'],
      ['🏠','إثبات محل إقامة','إيصال مرافق أو عقد سكن','أساسي'],
      ['🤝','مستندات الضامن','بطاقة الضامن + إقرار حسب العقد','قبل التسليم'],
      ['📋','مستندات إضافية','ممكن تُطلب لبعض الحالات (مثل ما يفيد محدودية الدخل أو الحالة الاجتماعية)','حسب الحالة']
    ].map(([ic,t,s,tag])=>`<div class="doc"><div class="ic">${ic}</div>
      <div class="t"><b>${t}</b><span>${s}</span></div>
      <span class="pill ${tag==='أساسي'?'p-brand':'p-mute'} plain">${tag}</span></div>`).join('')}
  </div>
  <p class="tiny dim" style="margin-top:10px">مش هنطلب منك الورق كله مرة واحدة. كل مستند بيتطلب في وقته وبيوصلك إشعار.</p>
</section>

<section class="sec">
  <div class="notice n-warn"><span class="ico">⚠</span><div>
    <b>مهم تعرفه قبل ما تقدّم</b>
    الموتوسيكل بيفضل مُرخّص باسم تريد واي طول مدة البرنامج. لو توقفت عن الشغل، أو الحساب اتقفل، أو ما التزمتش بالمؤشرات — بنتواصل معاك ونديك مهلة تصحيح، ولو الوضع استمر يحق لنا استرداد الموتوسيكل حسب العقد.</div></div>
</section>

<section class="sec faq" style="background:var(--surface2)">
  <div class="sec-h"><h3 class="sec-title">أسئلة بتتسأل كتير</h3></div>
  <div class="stack g8">
    ${[
      ['هل فيه أي فلوس بدفعها للتملّك؟','لا. مفيش مقدم ولا أقساط تملّك. التملّك مقابل الالتزام بالشغل فقط. البنزين والمخالفات والصيانة بعد الاستلام عليك.'],
      ['مش شغال على أوبر حاليًا — ينفع أقدّم؟','ينفع. دي حالة طبيعية جدًا في البرنامج، وفيه مرحلة كاملة اسمها «تجهيز الحساب» بنمشي فيها معاك خطوة بخطوة.'],
      ['معنديش رخصة قيادة لسه','قدّم وحدّد إنها «تحت الاستخراج». هتفضل في مسار التجهيز، والتسليم بيتم بعد ما الرخصة تخلص.'],
      ['ساكن في مدينة تانية غير القاهرة والغردقة','سجّل اهتمامك دلوقتي. الدفعة الأولى في القاهرة الكبرى والغردقة، والمدن الجديدة بتتفتح على دفعات.'],
      ['الموتوسيكل بيتنقل باسمي إمتى بالظبط؟','بعد ما تكمّل مدة البرنامج ومؤشرات التشغيل المعتمدة، وبعد مراجعة الاستحقاق من فريق البرنامج. الشروط النهائية بتتكتب في عقدك.']
    ].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}
  </div>
</section>

<div class="stickycta">
  <button class="btn btn-pri" style="flex:2" data-go="applicant:verify">ابدأ التقديم</button>
  <button class="btn btn-ghost" style="flex:1" data-go="applicant:track">طلبي</button>
</div>`);
</script>
<script>
/* ================= 2. تحقق من الترشيح ================= */
const S_verify = () => phone(`
${appHeader(`<button class="btn btn-ghost btn-sm" data-go="applicant:landing">رجوع</button>`)}
<section class="sec">

document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-portal],[data-screen],[data-go],[data-step],[data-sheet],[data-close],#openNotes,.opt,.slot,.pointcard,.chip');
  if(!t) return;
  if(t.id==='openNotes'){ openSheet(NOTES_HTML); return; }
  if(t.hasAttribute('data-close')){ closeSheet(); return; }
  if(t.hasAttribute('data-sheet')){ openSheet(HELP_HTML); return; }
  if(t.hasAttribute('data-portal')){ const p = PORTALS.find(x=>x.id===t.dataset.portal); go(p.id, p.screens[0].id); return; }
  if(t.hasAttribute('data-screen')){ go(cur.p, t.dataset.screen); return; }
  if(t.hasAttribute('data-go')){ e.preventDefault(); const [p,s] = t.dataset.go.split(':'); go(p,s); return; }
  if(t.hasAttribute('data-step')){ applyStep = +t.dataset.step; render(); return; }
  if(t.classList.contains('opt') || t.classList.contains('pointcard')){
    const group = t.parentElement;
    if(t.querySelector('input[type="checkbox"]')){ t.dataset.on = t.dataset.on==='1'?'0':'1'; return; }
    [...group.children].forEach(c=>{ if(c.dataset) c.dataset.on='0'; });
    t.dataset.on='1'; const r = t.querySelector('input'); if(r) r.checked = true; return;
  }
  if(t.classList.contains('slot')){
    if(t.disabled) return;
    [...t.parentElement.children].forEach(c=>c.dataset.on='0'); t.dataset.on='1'; return;
  }
  if(t.classList.contains('chip')){
    [...t.parentElement.children].forEach(c=>c.dataset.on='0'); t.dataset.on='1'; return;
  }
});
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeSheet(); });
document.addEventListener('click',(e)=>{ if(e.target.classList && e.target.classList.contains('sheet')) closeSheet(); });

(function init(){
  const h = (location.hash||'').replace('#','').split('/');
  const P = PORTALS.find(p=>p.id===h[0]);
  if(P){ cur.p = P.id; if(P.screens.some(s=>s.id===h[1])) cur.s = h[1]; else cur.s = P.screens[0].id; }
  render();
})();
</script>
