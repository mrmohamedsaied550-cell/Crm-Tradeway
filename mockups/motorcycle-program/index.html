<script>
/* ============ الوارد والمخزون ============ */
const CONSIGN = {
 'NM-101':[
  {id:'CN-2026-0412', src:'مورد — هوجان إيجيبت', eta:'20 سبتمبر · 11:00 ص', st:'في الطريق', late:false,
   units:['LHJ4K2...9F71','LHJ4K2...9F72','LHJ4K2...9F73','LHJ4K2...9F74','LHJ4K2...9F75','LHJ4K2...9F76']},
  {id:'CN-2026-0408', src:'تحويل من بايك هاوس — مدينة نصر', eta:'18 سبتمبر · 2:00 م', st:'متأخرة', late:true,
   units:['LHJ4K2...8C11','LHJ4K2...8C12']},
  {id:'CN-2026-0401', src:'مورد — هوجان إيجيبت', eta:'12 سبتمبر', st:'اتقفلت', late:false, done:true, units:[]}],
 'BH-204':[{id:'CN-2026-0410', src:'مورد — هوجان إيجيبت', eta:'21 سبتمبر · 9:00 ص', st:'في الطريق', late:false,
   units:['LHJ4K2...3C21','LHJ4K2...3C22','LHJ4K2...3C23']}],
 'HG-330':[{id:'CN-2026-0409', src:'تحويل من ورشة تريد واي — حلوان', eta:'22 سبتمبر', st:'في الطريق', late:false,
   units:['LHJ4K2...5E01','LHJ4K2...5E02']}]
};
const SCAN_OUT = {
  ok:['على الكشف','pos','الوحدة اتسجّلت وصلت — تحت فحص الوارد'],
  dup:['اتمسحت قبل كده','att','الوحدة دي اتمسحت في الشحنة دي بالفعل'],
  other:['على شحنة تانية','att','الوحدة على كشف شحنة تانية — بتتسجّل ومش بتتحسب هنا'],
  elsewhere:['تبع نقطة تانية','crit','الوحدة دي مخزون نقطة تانية. اتسجّلت في عهدتك ومتجمّدة لحد ما الإدارة تراجع'],
  unknown:['مش معروفة في السجل','crit','الشاسيه ده مش موجود عندنا خالص. اتسجّل كـ«وحدة غير مسجّلة» ومتجمّد'],
  delivered:['السجل بيقول مُسلّمة','crit','الوحدة دي متسجّلة إنها اتسلّمت لكابتن. وقف كل حاجة — الحالة اترفعت للإدارة فورًا']
};
const STOCKX = {
 'NM-101':[
  {plate:'ق ن 4261', ch:'LHJ4K2...8A17', st:'محجوز لميعاد', hold:'أحمد ناصر · 10:00', age:3},
  {plate:'ق ن 4279', ch:'LHJ4K2...9F42', st:'محجوز لميعاد', hold:'محمود سيد · 11:30', age:5},
  {plate:'ق ن 4283', ch:'LHJ4K2...9F51', st:'متاح', age:12},
  {plate:'ق ن 4290', ch:'LHJ4K2...7C90', st:'متاح', age:26},
  {plate:'ق ن 4301', ch:'LHJ4K2...7D11', st:'متاح', age:51},
  {plate:'—',        ch:'LHJ4K2...8B17', st:'مستلمة — تحت الترخيص', age:14},
  {plate:'—',        ch:'LHJ4K2...8B19', st:'مستلمة — تحت الترخيص', age:4},
  {plate:'ق ن 4255', ch:'LHJ4K2...6A33', st:'مرتجع — تحت الفحص', age:9},
  {plate:'ق ن 4240', ch:'LHJ4K2...6A10', st:'موقوف — تلف نقل', age:6}]
};
const stockOf = () => (STOCKX[APP.point.code] || STOCKX['NM-101']);
const ageTone = (st, d) => {
  if(st==='متاح') return d>=45?['crit','واقفة '+d+' يوم']:d>=21?['att','واقفة '+d+' يوم']:null;
  if(st==='مستلمة — تحت الترخيص') return d>=21?['crit','الترخيص متأخر '+d+' يوم']:d>=10?['att','الترخيص '+d+' يوم']:null;
  if(st==='مرتجع — تحت الفحص') return d>=14?['crit','الفحص متأخر '+d+' يوم']:d>=5?['att','الفحص '+d+' يوم']:null;
  return null;
};
const stTone = st => st==='متاح'?'ok':st==='محجوز لميعاد'?'brand':st.startsWith('موقوف')?'dan':
  st==='مرتجع — تحت الفحص'?'warn':st==='مستلمة — تحت الترخيص'?'info':'mute';

/* ---- P17 · الوارد والشحنات ---- */
const S_p17 = () => {
  const list = CONSIGN[APP.point.code] || [];
  return ptShell(`
  <div class="spread"><h3 style="font-size:22px;font-weight:700">الوارد والشحنات</h3>
    <button class="btn btn-soft btn-sm" data-st="sheet" data-k="request">اطلب وحدات</button></div>
  <p class="sm muted">الشحنات الجاية لنقطتك إنت بس. الاستلام بيفتحه مدير النقطة.</p>
  <div class="stack g10">${list.map((c,i)=>`<div class="ucard">
    <div class="spread"><div><div class="pl lat">${c.id}</div><div class="ch">${c.src}</div></div>
      ${c.done?pill('mute','اتقفلت'):c.late?pill('dan','متأخرة'):pill('info','في الطريق')}</div>
    <div class="foot"><span class="tiny dim">الوصول المتوقع: ${c.eta}</span>
      ${c.units.length?`<span class="pill p-mute plain lat">${c.units.length} وحدة</span>`:''}</div>
    ${c.done?'':`<button class="btn btn-pri" data-st="openRec" data-i="${i}"
      ${APP.user.role==='manager'?'':'disabled'}>ابدأ استلام الشحنة</button>
      ${APP.user.role==='manager'?'':'<span class="tiny dim">الاستلام بيفتحه مدير النقطة بس.</span>'}`}
  </div>`).join('')}</div>
  ${notice('info','النقطة ما بتخليش وحدة «متاحة»','إنت بتستلم وتعدّ وتصوّر وتبلّغ. الوحدة بتفضل «مستلمة — تحت الترخيص» لحد ما الإدارة تسجّل اللوحة والترخيص. ده اللي بيمنع إن كابتن يتحجزله موتوسيكل ما يقدرش يخرج من المعرض قانونًا.')}
  ${botNav('P17')}`);
};

/* ---- P18 · استلام شحنة ---- */
const REC_STEPS = ['طابق المندوب','امسح الوحدات','حالة الوصول','الفروقات','التوقيع والإقفال'];
const S_p18 = () => {
  if(!APP.rec) return ptShell(notice('info','مفيش استلام شغّال','افتح شحنة من «الوارد» وابدأ الاستلام. <button class="btn btn-soft btn-sm" data-st="go" data-s="P17" style="padding:2px 8px">روح للوارد</button>')+botNav('P18'));
  const c = (CONSIGN[APP.point.code]||[])[APP.rec.i], R = APP.rec, st = R.step;
  const scanned = R.scanned.length, total = c.units.length;
  let body = '';
  if(st===1) body = `
    <p class="sm muted">سجّل مين اللي جايب الشحنة قبل ما تفتح أي كرتونة. الصورة دي بتثبت إن العربية وصلت بحمولتها.</p>
    <div class="field"><label for="dv-nm">اسم المندوب</label><input class="inp" id="dv-nm" value="${R.dv||''}" placeholder="الاسم زي ما في بطاقته"></div>
    <div class="field"><label for="dv-ph">موبايله</label><input class="inp lat" id="dv-ph" inputmode="numeric" placeholder="01xxxxxxxxx"></div>
    <div class="field"><label for="dv-pl">لوحة العربية</label><input class="inp" id="dv-pl" placeholder="ا ب ج 1234"></div>
    <div class="cam ${R.dvPhoto?'shot':''}" data-st="tog" data-k="dvPhoto">
      ${ico(R.dvPhoto?'ok':'cam')}<b>${R.dvPhoto?'الصورة اتاخدت':'صوّر العربية وهي محمّلة'}</b></div>`;
  else if(st===2) body = `
    <p class="sm muted">امسح باركود الشاسيه أو اكتب آخر ٤ خانات. لو وحدة مش على الكشف، النظام هيقولك تعمل إيه.</p>
    <div class="spread"><b class="sm">${scanned} من ${total} اتمسحت</b>
      <span class="track" style="width:120px;margin:0"><i style="width:${total?scanned/total*100:0}%"></i></span></div>
    <div class="card tight">${c.units.map((u,j)=>{
      const done = R.scanned.includes(j);
      return `<div class="scanrow"><div class="id"><b class="lat">${u}</b><span>${done?'اتمسحت':'لسه'}</span></div>
        ${done?pill('ok','على الكشف'):`<button class="btn btn-soft btn-sm" data-st="scan" data-i="${j}">امسح</button>`}</div>`;}).join('')}</div>
    <div class="field"><label for="odd-ch">وحدة مش على الكشف؟ اكتب الشاسيه</label>
      <div class="row" style="gap:8px"><input class="inp lat" id="odd-ch" style="flex:1" placeholder="آخر ٦ خانات">
        <button class="btn btn-ghost btn-sm" data-st="oddScan">تحقّق</button></div></div>
    ${R.oddOut?notice(R.oddOut[1]==='pos'?'ok':R.oddOut[1]==='att'?'warn':'dan', SCAN_OUT[R.oddKey][0], R.oddOut[2]):''}`;
  else if(st===3) body = `
    <p class="sm muted">٤ صور لكل شحنة، وقراءة العداد، وتحديد لو فيه تلف نقل. مفيش اختيار افتراضي هنا عن قصد.</p>
    <div class="shots">${['أمام','خلف','جنب','العداد ورقم الشاسيه'].map((t,j)=>`
      <div class="shot-tile" data-on="${(R.shots||[]).includes(j)?1:0}" data-st="shot" data-i="${j}">${t}</div>`).join('')}</div>
    <div class="field"><label for="rec-odo">قراءة العداد (كم)</label>
      <input class="inp lat" id="rec-odo" value="${R.odo||'6'}">
      <span class="hint">فوق 15 كم بيتسجّل تنبيه · فوق 80 كم بيتفتح استفسار أوتوماتيك.</span></div>
    <div class="opts inline">
      ${[['سليمة','ok'],['فيها تلف نقل','bad']].map(([t,v])=>`
      <label class="opt" data-on="${R.cond===v?1:0}" data-st="pick" data-k="cond" data-v="${v}">
        <input type="radio" name="cond" ${R.cond===v?'checked':''}><b>${t}</b></label>`).join('')}</div>
    ${R.cond==='bad'?notice('dan','تلف نقل','الوحدات التالفة بتتحول لـ«موقوف — تلف نقل» ومش بتدخل المخزون. بتتفتح حالة على شركة النقل خلال ٧ أيام.'):''}`;
  else if(st===4){
    const missing = total - scanned;
    body = `
    <p class="sm muted">راجع الأرقام قبل ما المندوب يمشي. كل سطر ناقص لازم يتحدد سببه.</p>
    <div class="grid2">
      <div class="metric"><div class="cap">وصلت سليمة</div><div class="top"><span class="val">${R.cond==='bad'?Math.max(0,scanned-1):scanned}</span></div></div>
      <div class="metric"><div class="cap">وصلت وفيها تلف</div><div class="top"><span class="val">${R.cond==='bad'?1:0}</span>${R.cond==='bad'?pill('dan','حالة'):''}</div></div>
      <div class="metric"><div class="cap">على الكشف وما وصلتش</div><div class="top"><span class="val">${missing}</span>${missing?pill('warn','سبب مطلوب'):''}</div></div>
      <div class="metric"><div class="cap">وصلت ومش على الكشف</div><div class="top"><span class="val">${R.odd||0}</span></div></div>
    </div>
    ${missing?`<div class="field"><label for="ms-r">سبب النقص — إجباري</label>
      <select class="inp" id="ms-r"><option>المندوب بيقول ما اتحمّلتش من المورد</option>
        <option>على الكشف بالغلط</option><option>اتفرّغت في نقطة تانية</option><option>مفقودة — بلاغ</option></select></div>`:''}
    ${notice('warn','النقص بيتسجّل «مفقودة — تحت البحث»','مش بيتشال من الكشف. بيفضل مفتوح على شركة النقل لحد ما يترد عليه، وبيرجع بشحنة سطر واحد.')}`;
  } else body = `
    <p class="sm muted">المندوب بيمضي على العدد اللي اتسلّم فعلًا، ومدير النقطة بيقفل بالرقم السري.</p>
    <div class="card tight"><dl class="kv">
      <dt>الشحنة</dt><dd class="lat">${c.id}</dd>
      <dt>اتسلّم فعلًا</dt><dd class="lat">${scanned} من ${total}</dd>
      <dt>المندوب</dt><dd>${R.dv||'—'}</dd>
      <dt>المستلم</dt><dd>${APP.user.nm}</dd></dl></div>
    <div><b class="sm">توقيع المندوب</b>
      <div class="sig" data-on="${R.sig?1:0}" data-st="tog" data-k="sig" style="margin-block-start:8px">
        ${R.sig?`<span class="ink">توقيع</span>`:'امضي هنا'}</div></div>
    <div class="field"><label for="rec-pin">الرقم السري لمدير النقطة</label>
      <input class="inp lat" id="rec-pin" inputmode="numeric" maxlength="4" placeholder="••••" style="max-width:140px"></div>`;
  return ptShell(`
  <div class="spread"><div><span class="eyebrow">استلام شحنة</span>
    <h3 style="font-size:22px;font-weight:700">${c.id}</h3>
    <p class="tiny dim">${c.src}</p></div></div>
  <div class="runner">
    <div class="rail"><span>الخطوة ${st} من 5</span>
      ${REC_STEPS.map((x,j)=>`<i class="${j+1<st?'done':j+1===st?'now':''}"></i>`).join('')}</div>
    <div class="step-body"><h4 class="step-h">${st}. ${REC_STEPS[st-1]}</h4>${body}</div>
    <div class="step-foot">
      ${st>1?`<button class="btn btn-ghost btn-sm" data-st="recBack">السابق</button>`:''}
      <div style="flex:1"></div>
      <button class="btn btn-pri" data-st="recNext">${st<5?'كمّل':'اقفل الاستلام'}</button></div>
  </div>
  ${botNav('P18')}`);
};
</script>
<script>
/* ---- P11 · مخزون النقطة (rebuilt, phone-only) ---- */
const SEGS = [['have','عندي'],['coming','جاي'],['stuck','واقف'],['reply','محتاج ردّ']];
const S_p11x = () => {
  const all = stockOf(), seg = APP.seg || 'have';
  const inbound = (CONSIGN[APP.point.code]||[]).filter(c=>!c.done);
  const avail = all.filter(u=>u.st==='متاح').length;
  const booked14 = 6, cover = booked14? (avail/(booked14/14)) : 99;
  const coverTone = cover<2?'dan':cover<5?'warn':'ok';
  const stuck = all.filter(u=>u.st.startsWith('موقوف') || u.st==='مرتجع — تحت الفحص' ||
    (u.st==='مستلمة — تحت الترخيص' && u.age>=10));
  const reply = all.filter(u=>ageTone(u.st,u.age));
  const lists = {have: all.filter(u=>['متاح','محجوز لميعاد','مستلمة — تحت الترخيص'].includes(u.st)),
                 stuck, reply};
  const card = (u) => { const t = ageTone(u.st,u.age);
    return `<div class="ucard" data-st="unit" data-p="${u.plate}">
      <div class="spread"><div><div class="pl">${u.plate}</div><div class="ch lat">${u.ch}</div></div>
        ${pill(stTone(u.st), u.st)}</div>
      <div class="foot">${u.hold?`<span class="tiny dim">محجوزة لـ ${u.hold}</span>`:''}
        ${t?`<span class="pill p-${t[0]==='crit'?'dan':'warn'} plain">${t[1]}</span>`:''}</div></div>`;};
  return ptShell(`
  <div class="spread"><h3 style="font-size:22px;font-weight:700">مخزون النقطة</h3>
    <span class="pt-scope">${ico('pin','ic')}${APP.point.name}</span></div>
  <div class="grid2">
    <div class="metric"><div class="cap">متاح دلوقتي</div><div class="top"><span class="val">${avail}</span></div></div>
    <div class="metric"><div class="cap">التغطية</div>
      <div class="cover"><b>${cover>=99?'—':cover.toFixed(1)}</b><span class="tiny dim">يوم</span>
        ${pill(coverTone, coverTone==='dan'?'حرج':coverTone==='warn'?'منخفضة':'كويسة')}</div>
      <div class="track"><i class="${coverTone==='dan'?'bad':coverTone==='warn'?'mid':'good'}"
        style="width:${Math.min(100,cover/10*100)}%"></i><span class="tick" style="inset-inline-end:50%"></span></div>
      <div class="cap" style="margin-block-start:5px">العلامة = ٥ أيام · محسوبة من مواعيدك الجاية مش من رقم ثابت</div></div>
  </div>
  <div class="segbar">${SEGS.map(([k,t])=>{
    const n = k==='coming'? inbound.reduce((a,c)=>a+c.units.length,0) : (lists[k]||[]).length;
    return `<button type="button" data-st="seg" data-v="${k}" data-on="${k===seg?1:0}">${t}
      <span class="lat" style="opacity:.7;margin-inline-start:5px">${n}</span></button>`;}).join('')}</div>
  ${seg==='coming'
    ? (inbound.length?`<div class="stack g10">${inbound.map(c=>`<div class="ucard">
        <div class="spread"><div><div class="pl lat">${c.id}</div><div class="ch">${c.src}</div></div>
          ${c.late?pill('dan','متأخرة'):pill('info','في الطريق')}</div>
        <div class="foot"><span class="tiny dim">${c.eta}</span>
          <span class="pill p-mute plain lat">${c.units.length} وحدة</span></div>
        <p class="tiny dim">الوحدات دي مش محسوبة في مخزونك لحد ما تستلمها — بتبان في سطر «التغطية مع الوارد» بس.</p>
      </div>`).join('')}</div>` : `<div class="card" style="text-align:center;color:var(--text-3)">مفيش شحنات جاية.</div>`)
    : (lists[seg].length?`<div class="stack g10">${lists[seg].map(card).join('')}</div>`
       : `<div class="card" style="text-align:center;color:var(--text-3)">مفيش وحدات في القسم ده.</div>`)}
  ${seg==='reply'&&lists.reply.length?notice('warn','الوحدات دي محتاجة ردّ منك','ساعة الوقوف بتبدأ من أول ما الوحدة تبقى متاحة، وما بترجعش لصفر لو حجز اتلغى. وحدة واقفة ٤٥ يوم = فلوس نايمة في الفناء.'):''}
  ${notice('info','', 'عرض فقط — المعرض ما يقدرش يغيّر حالة وحدة، ولا يعيد تخصيصها، ولا يشوف مخزون نقطة تانية. كل اللي فوق طلبات وبلاغات.')}
  <div class="row"><button class="btn btn-ghost btn-sm" data-st="sheet" data-k="request">اطلب وحدات</button>
    <button class="btn btn-ghost btn-sm" data-st="go" data-s="P21">الجرد الأسبوعي</button></div>
  ${botNav('P11')}`);
};
/* ---- P21 · الجرد الكامل الأسبوعي ---- */
const S_p21 = () => {
  const all = stockOf(), done = (APP.cnt||[]).length;
  return ptShell(`
  <h3 style="font-size:22px;font-weight:700">الجرد الكامل الأسبوعي</h3>
  <p class="sm muted">كل سبت، وبيمنع فتح اليوم لحد ما يخلص. بيشمل الوحدات المتجمّدة كمان.</p>
  <div class="spread"><b class="sm">${done} من ${all.length}</b>
    <span class="track" style="width:140px;margin:0"><i style="width:${done/all.length*100}%"></i></span></div>
  <div class="stack g8">${all.map((u,i)=>{
    const c = (APP.cnt||[]).includes(i);
    return `<div class="ucard" style="cursor:default">
      <div class="spread"><div><div class="pl">${u.plate}</div><div class="ch lat">${u.ch}</div></div>
        ${c?pill('ok','موجودة'):pill('mute','لسه')}</div>
      ${c?'':`<div class="row" style="gap:8px"><button class="btn btn-pri btn-sm" style="flex:1" data-st="cnt" data-i="${i}">موجودة</button>
        <button class="btn btn-soft btn-sm" data-st="cntMiss" data-i="${i}">مش موجودة</button></div>`}
    </div>`;}).join('')}</div>
  ${notice('warn','الفرق مرتين على نفس الوحدة = تجميد','أول فرق بيفتح حالة. تاني فرق متتالي على نفس الوحدة بيحوّلها لـ«موقوف — تحقيق». ٣ وحدات متجمّدة بتوقف أي شحنة جديدة للنقطة.')}

    if(R.step===2 && R.scanned.length===0){ APP.toast='امسح وحدة واحدة على الأقل.'; render(); return; }
    if(R.step===3){ if(R.shots.length<4 || !R.cond){ APP.toast='لازم ٤ صور وتحديد لو فيه تلف نقل.'; render(); return; } }
    if(R.step===5){
      ptLog('استلام شحنة', c.id+' — '+R.scanned.length+' وحدة');
      c.done=true; c.st='اتقفلت'; APP.rec=null; APP.screen='P17';

      render(); return; }
    R.step++; }
  else if(k==='cnt'){ APP.cnt=APP.cnt||[]; if(!APP.cnt.includes(i)) APP.cnt.push(i); }
  else if(k==='cntMiss'){ APP.cnt=APP.cnt||[]; if(!APP.cnt.includes(i)) APP.cnt.push(i);
    APP.toast='الفرق اتسجّل واتفتحت حالة. لو تكرر على نفس الوحدة هتتجمّد.'; }

  else if(k==='sheet'){ openSheet(stSheet(t.dataset.k)); return; }
  else if(k==='unit'){ APP.unitP=t.dataset.p; openSheet(stSheet('unit')); return; }
  else if(k==='doRequest'){ ptLog('طلب وحدات', (APP.reqKind==='extra'?'وحدات زايدة':'محتاج وحدات'));
    closeSheet(); APP.toast='الطلب اتبعت للإدارة. هي اللي بتعمل الشحنة أو التحويل — المعرض بيطلب بس.'; }

<script>
/* ================= شاشة العرض التفاعلية ================= */
const PITCH = {aud:'captain', rent:120, hours:8, days:6, acc:7, canc:2, batch:1000, city:'cairo',
  mHours:8, mDays:26, mAcc:60, mCanc:2};

  hurghada:{nm:'الغردقة', pts:['موتو الغردقة — الدهار'], cap:6, share:150}
};
function verdict(){
  const daysM = Math.round(PITCH.days*4.33);
  const accPct = PITCH.acc*10;
  const miss = [];
  if(PITCH.hours < PITCH.mHours) miss.push(['ساعات الاتصال', PITCH.hours+' مقابل '+PITCH.mHours]);
  if(daysM < PITCH.mDays) miss.push(['أيام التشغيل', daysM+' مقابل '+PITCH.mDays]);
  if(accPct < PITCH.mAcc) miss.push(['نسبة القبول', accPct+'% مقابل '+PITCH.mAcc+'%']);
  if(PITCH.canc > PITCH.mCanc) miss.push(['نسبة الإلغاء', PITCH.canc+'% مقابل '+PITCH.mCanc+'%']);
  const hard = miss.filter(m=>{
    if(m[0]==='ساعات الاتصال') return PITCH.hours < PITCH.mHours*0.9;
    if(m[0]==='أيام التشغيل') return daysM < PITCH.mDays*0.9;
    if(m[0]==='نسبة القبول') return accPct < PITCH.mAcc*0.9;
    return PITCH.canc > PITCH.mCanc*1.5;
  });
  return {daysM, accPct, miss, k: miss.length===0 ? 'pass' : hard.length ? 'fail' : 'edge'};
}

         <p>${V.miss.map(m=>m[0]+': '+m[1]).join(' · ')}. الفرق ده مش بيتعوّض بشهر كويس، وبيوصل في الآخر لمهلة تصحيح وبعدها استرداد الموتوسيكل.</p>

  }

document.addEventListener('click',(e)=>{

  const k=t.dataset.pi, v=t.dataset.v;
  if(k==='aud'){ PITCH.aud=v; render(); }
  else if(k==='city'){ PITCH.city=v; render(); }
  else if(k==='batch'){ PITCH.batch=+v; render(); }
  else if(k==='resetMatrix'){ PITCH.mHours=8; PITCH.mDays=26; PITCH.mAcc=60; PITCH.mCanc=2; render(); }
});
document.addEventListener('input',(e)=>{
  const t=e.target.closest('input[type=range][data-pi]'); if(!t) return;
  PITCH[t.dataset.pi] = +t.value;

});

document.addEventListener('click',(e)=>{
  const t = e.target.closest('[data-adm]'); if(!t || t.tagName==='SELECT') return;
  e.preventDefault();
  const k = t.dataset.adm; ADM.toast=null;
  if(k==='queue'){ ADM.queue=t.dataset.q; }
  else if(k==='dec'){ openSheet(decisionSheet(t.dataset.d, t.dataset.n)); return; }
  else if(k==='reason'){ [...t.parentElement.children].forEach(c=>c.dataset.on='0'); t.dataset.on='1';
    const r=t.querySelector('input'); if(r) r.checked=true; return; }
  else if(k==='doDec'){ const D=DEC[t.dataset.d];
    ADM.toast='اتسجّل القرار: '+D.verb+' — باسم '+roleNow().who+' وبالسبب المختار، ومعاه نسخة الشروط ونسخة الماتريكس. الرسالة اتبعتت على: '+D.ch;
    closeSheet(); }
  else if(k==='pullFile'){ ADM.toast='الملف اتسحب وبقى مسند ليك. هتلاقيه في «شغلي».'; }
  else if(k==='newImport'){ ADM.impStep=2; }
  else if(k==='impNext'){ ADM.impStep=Math.min(5,ADM.impStep+1); }
  else if(k==='impCancel'){ ADM.impStep=1; }
  else if(k==='commitImport'){ ADM.impStep=5; }
  render();
});

let cur = {p:'applicant', s:'landing'};
const $ = (q)=>document.querySelector(q);
const PREFIX = {pitch:'P', applicant:'A', admin:'B', point:'C'};

function renderTabs(){
  $('#portalTabs').innerHTML = PORTALS.map(p=>
    `<button role="tab" data-portal="${p.id}" aria-selected="${p.id===cur.p}">${p.tab}</button>`).join('');
}
function render(){
  const P = PORTALS.find(p=>p.id===cur.p) || PORTALS[0];
  const S = P.screens.find(s=>s.id===cur.s) || P.screens[0];
  cur.s = S.id;
  renderTabs();
  $('#screenNav').innerHTML = P.screens.map((s,i)=>
    `<button data-screen="${s.id}" aria-current="${s.id===cur.s}">
      <span class="ix">${PREFIX[P.id]}${i+1}</span>${s.nav}</button>`).join('');
  $('#scTitle').textContent = S.title;
  $('#scDesc').textContent = S.desc;
  $('#scKind').textContent = P.kind;
  if(P.id==='point' && APP.point) cur.s = APP.screen;
  $('#scMount').innerHTML = S.render();
  if(P.id==='pitch') pitchRecalc();
  if(P.id==='point'){
    const nav = $('#screenNav');
    [...nav.children].forEach(b=>b.setAttribute('aria-current', b.dataset.screen===(APP.point?APP.screen:'P0')));
  }
  const act = $(`#screenNav button[aria-current="true"]`);
  if(act) act.scrollIntoView({block:'nearest', inline:'center'});
  try{ location.hash = cur.p+'/'+cur.s; }catch(e){}
}
function go(p,s){
  if(p==='point'){ if(!APP.point && s!=='P0'){ APP.screen='P0'; s='P0'; } else { APP.screen=s; } }
  cur = {p, s}; render(); window.scrollTo({top:0, behavior:'smooth'});
}

function openSheet(html){
  $('#sheetMount').innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in">${html}</div></div>`;
}
function closeSheet(){ $('#sheetMount').innerHTML = ''; }

/* ================= أحداث ================= */
document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-portal],[data-screen],[data-go],[data-step],[data-sheet],[data-close],#openNotes,.opt,.slot,.pointcard,.chip');
  if(!t) return;
  if(t.id==='openNotes'){ openSheet(NOTES_HTML); return; }
  if(t.hasAttribute('data-close')){ closeSheet(); return; }
  if(t.hasAttribute('data-sheet')){ openSheet(HELP_HTML); return; }
  if(t.hasAttribute('data-portal')){ const p = PORTALS.find(x=>x.id===t.dataset.portal); go(p.id, p.screens[0].id); return; }
  if(t.hasAttribute('data-screen')){ go(cur.p, t.dataset.screen); return; }
  if(t.hasAttribute('data-go')){ e.preventDefault(); const [p,s] = t.dataset.go.split(':'); go(p,s); return; }
  if(t.hasAttribute('data-step')){ applyStep = +t.dataset.step; render(); return; }
  if(t.classList.contains('opt') || t.classList.contains('pointcard')){
    const group = t.parentElement;
    if(t.querySelector('input[type="checkbox"]')){ t.dataset.on = t.dataset.on==='1'?'0':'1'; return; }
    [...group.children].forEach(c=>{ if(c.dataset) c.dataset.on='0'; });
    t.dataset.on='1'; const r = t.querySelector('input'); if(r) r.checked = true; return;
  }
  if(t.classList.contains('slot')){
    if(t.disabled) return;
    [...t.parentElement.children].forEach(c=>c.dataset.on='0'); t.dataset.on='1'; return;
  }
  if(t.classList.contains('chip')){
    [...t.parentElement.children].forEach(c=>c.dataset.on='0'); t.dataset.on='1'; return;
  }
});
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeSheet(); });
document.addEventListener('click',(e)=>{ if(e.target.classList && e.target.classList.contains('sheet')) closeSheet(); });

window.addEventListener('hashchange', ()=>{
  const h=(location.hash||'').replace('#','').split('/');
  const P=PORTALS.find(p=>p.id===h[0]); if(!P) return;
  if(cur.p===P.id && cur.s===h[1]) return;
  go(P.id, P.screens.some(s=>s.id===h[1]) ? h[1] : P.screens[0].id);
});

(function init(){
  const pm = document.getElementById('protoMark');
  if(pm) pm.innerHTML = LOGO_ICON.replace('class="tw-icon"','class="mark"');
  const h = (location.hash||'').replace('#','').split('/');
  const P = PORTALS.find(p=>p.id===h[0]);
  if(P){ cur.p = P.id; if(P.screens.some(s=>s.id===h[1])) cur.s = h[1]; else cur.s = P.screens[0].id; }
  render();
})();
